<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Estamos construyendo algo nuevo para ti. Muy pronto podrás descubrir el nuevo sitio de EFY Seguros.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Próximamente · EFY Seguros">
  <meta property="og:description" content="Estamos construyendo algo nuevo para ti.">
  <meta property="og:image" content="https://www.efyseguros.com/assets/efy-seguros.png">
  <title>Próximamente · EFY Seguros</title>
  <link rel="preload" href="assets/fonts/nunito-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family:"Nunito Sans"; src:url("assets/fonts/nunito-sans-latin-700-normal.woff2") format("woff2"); font-style:normal; font-weight:700; font-display:swap; }
    @font-face { font-family:"IBM Plex Sans"; src:url("assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; }
    :root { color-scheme:light; --ink:#17233d; --blue:#445ea5; --magenta:#c61649; --muted:#606b7e; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font-family:"IBM Plex Sans",Arial,sans-serif; }
    .page { min-height:100svh; display:flex; flex-direction:column; padding:48px 24px 24px; }
    main { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; width:100%; max-width:680px; margin:auto; text-align:center; padding:24px 0 72px; }
    .brand { position:relative; width:min(340px,85%); aspect-ratio:1799 / 874; overflow:hidden; }
    .logo { display:block; width:100%; height:auto; }
    .logo-motion { position:absolute; width:117.3913%; height:auto; left:50%; top:50%; transform:translate(-50%,-50%); visibility:hidden; }
    .brand.is-animating .logo { opacity:0; }
    .brand.is-animating .logo-motion { visibility:visible; }
    .message { margin-top:48px; width:100%; }
    .eyebrow { margin:0 0 18px; color:var(--magenta); font-size:12px; letter-spacing:2.4px; text-transform:uppercase; }
    h1 { font-family:"Nunito Sans",Arial,sans-serif; font-weight:700; font-size:clamp(30px,3.7vw,46px); line-height:1.2; letter-spacing:-1.2px; margin:0; }
    h1 span { color:var(--blue); }
    .intro { max-width:360px; margin:24px auto 0; color:var(--muted); font-size:16px; line-height:1.65; text-wrap:pretty; }
    footer { text-align:center; color:var(--muted); font-size:12px; line-height:1.5; }
    footer p { margin:0; }
    @media (max-width:480px) {
      .page { padding:32px 24px 20px; }
      main { padding:16px 0 48px; }
      .brand { width:min(280px,100%); }
      .message { margin-top:36px; }
      h1 { letter-spacing:-.8px; }
      .intro { font-size:15px; margin-top:20px; max-width:290px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="brand">
        <img class="logo" src="assets/efy-seguros.png" alt="EFY Seguros, tu mejor elección" width="1799" height="874" fetchpriority="high">
        <video class="logo-motion" muted playsinline preload="none" aria-hidden="true" width="1080" height="1080"></video>
      </div>
      <section class="message" aria-labelledby="headline">
        <p class="eyebrow">Próximamente</p>
        <h1 id="headline">Estamos construyendo<br><span>algo nuevo para ti.</span></h1>
        <p class="intro">Muy pronto podrás descubrir<br>el nuevo sitio de EFY Seguros.</p>
      </section>
    </main>
    <footer><p>efyseguros.com</p></footer>
  </div>
  <script>
    const brand = document.querySelector('.brand');
    const video = document.querySelector('.logo-motion');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    function showLogo() {
      video.pause();
      brand.classList.remove('is-animating');
    }
    video.addEventListener('error', showLogo);
    motionPreference.addEventListener('change', event => {
      if (event.matches) showLogo();
    });
    if (!motionPreference.matches) {
      video.src = 'assets/efy-logo-animado.mp4';
      video.play().then(() => {
        if (!motionPreference.matches) brand.classList.add('is-animating');
      }).catch(showLogo);
    }
  </script>
</body>
</html>
