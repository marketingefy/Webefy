<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url('/font.woff2');font-weight:500}*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#080e1d}.stage{position:relative;width:1280px;height:720px;overflow:hidden}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.background.video{opacity:0}.ready .background.video{opacity:1}
.hologram{position:absolute;width:112px;height:104px;perspective:650px;isolation:isolate;color:#dceaff;font:500 10px Plex,sans-serif;--glow:0;--angle:0deg;transform:translateY(var(--lift,0px))}
.glass{position:absolute;inset:0 0 11px;border:1px solid #b6d8ff80;border-radius:10px;background:linear-gradient(135deg,#d4e6ff13,#4a86bd0c);box-shadow:inset 0 1px 0 #fff3,0 0 9px #57b7ff38;backdrop-filter:blur(1px)}
.glass::after{content:'';position:absolute;inset:-1px;border:1px solid #ff8fc3;border-radius:10px;opacity:var(--glow);box-shadow:0 0 16px #f25c9d77,inset 0 0 16px #f25c9d18}
.turner{position:absolute;left:6px;right:6px;top:4px;height:78px;transform-style:preserve-3d;transform:rotateY(var(--angle))}
.face{position:absolute;inset:0;display:flex;align-items:end;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1.5px);filter:drop-shadow(0 3px 7px #4eb8ff66)}
.face.back{transform:rotateY(180deg) translateZ(1.5px)}.crop{overflow:hidden;position:relative;flex-shrink:0;margin-bottom:4px}.crop img{position:absolute;max-width:none}
.label{position:absolute;left:0;right:0;bottom:17px;text-align:center;letter-spacing:.02em;text-shadow:0 1px 4px #001b4b}
.base{position:absolute;bottom:0;left:0;width:100%;height:15px;border:1px solid #9dd9ffbb;border-radius:50%;background:radial-gradient(ellipse,#62c5ff24,transparent 65%);box-shadow:0 0 12px #5ba9ff66,inset 0 0 9px #53c9ff55}
.base::after{content:'';position:absolute;inset:3px 11px;border:1px solid #f9a0cc99;border-radius:50%;opacity:var(--glow)}
</style></head><body><div class="stage"><img class="background" src="/escena-referencia.jpg"><video class="background video" muted playsinline preload="auto" src="/base.mp4"></video><div id="cards"></div></div><script>
const SPECS=[
 {name:'Vehículo',x:.580,y:.440,start:1,bbox:[43,231,744,390]},
 {name:'Hogar',x:.665,y:.480,start:4,bbox:[819,64,656,571]},
 {name:'Salud',x:.750,y:.520,start:7,bbox:[1595,92,474,555]}
];
for(const spec of SPECS){
 const node=document.createElement('div');node.className='hologram';node.style.left=(spec.x*1280-56)+'px';node.style.top=(spec.y*720)+'px';node.dataset.name=spec.name;
 const [x,y,w,h]=spec.bbox,scale=Math.min(97/w,72/h);
 const icon='<span class="crop" style="width:'+(w*scale)+'px;height:'+(h*scale)+'px"><img src="/iconos.png" style="width:'+(2172*scale)+'px;height:'+(724*scale)+'px;left:'+(-x*scale)+'px;top:'+(-y*scale)+'px"></span>';
 node.innerHTML='<div class="glass"></div><div class="turner"><div class="face">'+icon+'</div><div class="face back">'+icon+'</div></div><span class="label">'+spec.name+'</span><div class="base"></div>';
 document.getElementById('cards').append(node);spec.node=node;
}
const video=document.querySelector('video');
window.setHologramTime=t=>{
 for(const s of SPECS){const p=Math.max(0,Math.min(1,(t-s.start)/2.5)),ease=p*p*(3-2*p);s.node.style.setProperty('--lift',(-3*Math.sin(Math.PI*p))+'px');s.node.style.setProperty('--angle',(360*ease)+'deg');s.node.style.setProperty('--glow',String(Math.sin(Math.PI*p)*.85));}
};
window.drawFrame=async t=>{
 if(video.readyState<2)await new Promise((resolve,reject)=>{video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',reject,{once:true});});
 if(Math.abs(video.currentTime-t)>.0001)await new Promise(resolve=>{video.addEventListener('seeked',resolve,{once:true});video.currentTime=t;});
 document.body.classList.add('ready');window.setHologramTime(t);await new Promise(requestAnimationFrame);
};
window.setHologramTime(0);
</script></body></html>
