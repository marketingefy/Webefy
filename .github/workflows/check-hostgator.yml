name: Comprobar acceso a HostGator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar servicio SSH sin iniciar sesión
        run: python3 scripts/check_hostgator.py server
      - name: Validar clave guardada sin mostrarla
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: python3 scripts/check_hostgator.py key
      - name: Verificar inicio de sesión y carpeta sin modificar archivos
        env:
          SSH_HOST: ${{ vars.SSH_HOST || '162.241.61.73' }}
          SSH_PORT: ${{ vars.SSH_PORT || '2222' }}
          SSH_DIRECTORY: ${{ vars.SSH_DIRECTORY || '/home1/brayanez/public_html' }}
          SSH_USER: ${{ vars.SSH_USER || 'brayanez' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: python3 scripts/deploy_sftp.py --check
