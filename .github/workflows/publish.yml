name: Publicar EFY en HostGator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/deploy_sftp.py'
      - 'scripts/verify_publication.py'
      - 'scripts/verify_coverage_browser.cjs'
      - '.github/hostgator_known_hosts'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

concurrency:
  group: hostgator-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar consulta de cobertura con datos ficticios
        run: |
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/site,readonly" \
            php:8.3-cli php -l /site/public/nueva/api/coberturas.php
          node --check public/assets/site/coberturas.js
          python3 tests/coverage/test_api.py
      - name: Validar recepción de siniestros sin enviar correos reales
        run: |
          chmod +x tests/claims/fake-sendmail.sh
          trap 'docker rm -f efy-claims-test efy-claims-fail >/dev/null 2>&1 || true' EXIT
          docker run -d --name efy-claims-test -p 127.0.0.1:8088:8088 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/public,dst=/site/public,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/claims,dst=/tests,readonly" \
            -e EFY_CLAIMS_STATE_DIR=/tmp/efy-state \
            php:8.3-cli php -d sendmail_path=/tests/fake-sendmail.sh -S 0.0.0.0:8088 -t /site/public
          docker run -d --name efy-claims-fail -p 127.0.0.1:8089:8088 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/public,dst=/site/public,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/claims,dst=/tests,readonly" \
            -e EFY_CLAIMS_STATE_DIR=/tmp/efy-state -e EFY_TEST_MAIL_EXIT=1 \
            php:8.3-cli php -d sendmail_path=/tests/fake-sendmail.sh -S 0.0.0.0:8088 -t /site/public
          docker exec efy-claims-test php -l /site/public/nueva/api/siniestros.php
          python3 tests/claims/test_api.py
      - name: Publicar mediante SFTP seguro
        env:
          SSH_HOST: ${{ vars.SSH_HOST || '162.241.61.73' }}
          SSH_PORT: ${{ vars.SSH_PORT || '2222' }}
          SSH_DIRECTORY: ${{ vars.SSH_DIRECTORY || '/home1/brayanez/public_html' }}
          SSH_USER: ${{ vars.SSH_USER || 'brayanez' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          python3 scripts/deploy_sftp.py --check
          python3 scripts/deploy_sftp.py
      - name: Verificar página publicada
        run: python3 scripts/verify_publication.py
      - name: Verificar consulta completa desde el navegador
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/efy-browser-verification/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/efy-browser-verification" --no-audit --no-fund playwright-core@1.56.1
          node scripts/verify_coverage_browser.cjs
