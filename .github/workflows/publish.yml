name: Publicar EFY en HostGator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/deploy_sftp.py'
      - 'scripts/verify_publication.py'
      - '.github/hostgator_known_hosts'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

concurrency:
  group: hostgator-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publicar mediante SFTP seguro
        env:
          SSH_HOST: ${{ vars.SSH_HOST || '162.241.61.73' }}
          SSH_PORT: ${{ vars.SSH_PORT || '2222' }}
          SSH_DIRECTORY: ${{ vars.SSH_DIRECTORY || '/home1/brayanez/public_html' }}
          SSH_USER: ${{ vars.SSH_USER || 'brayanez' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          python3 scripts/deploy_sftp.py --check
          python3 scripts/deploy_sftp.py
      - name: Verificar página publicada
        run: python3 scripts/verify_publication.py
